gauntlet:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('GCP_ANALYTICS_DATASET', 'analytics') }}"
      location: "{{ env_var('GCP_REGION', 'US') }}"
      threads: 4
      priority: interactive
      job_execution_timeout_seconds: 600
